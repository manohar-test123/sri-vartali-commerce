name: Apply DB migration

# Applies a SQL file to the project database and verifies the result.
# Manual-only (workflow_dispatch): migrations run after review, never
# automatically. Requires the SUPABASE_DB_PASSWORD repo secret.
#
# The local dev network blocks Postgres ports (only 22/443 allowed), so
# database operations ride GitHub-hosted runners, which have open egress.
# The password lives only in encrypted Actions secrets — never in code,
# commits, or logs (GitHub masks it automatically).

on:
  workflow_dispatch:
    inputs:
      migration:
        description: "SQL file to apply (repo-relative path)"
        required: true
        default: docs/db/schema.sql

permissions:
  contents: read

concurrency:
  group: db-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: aws-0-ap-south-1.pooler.supabase.com
      PGPORT: "5432"
      PGUSER: postgres.khuumibmulaggqddrrtih
      PGDATABASE: postgres
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION: ${{ inputs.migration }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check inputs
        run: |
          test -n "$PGPASSWORD" || { echo "SUPABASE_DB_PASSWORD secret is not set"; exit 1; }
          test -f "$MIGRATION" || { echo "Migration file not found: $MIGRATION"; exit 1; }

      - name: Apply migration
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATION"

      - name: Verify
        run: |
          psql -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
            \echo '--- RLS on every public table (expect rls_on=t, forced=t everywhere) ---'
            select relname as table_name,
                   relrowsecurity as rls_on,
                   relforcerowsecurity as forced
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and relkind = 'r'
            order by relname;

            \echo '--- settings singleton (expect t) ---'
            select count(*) = 1 as settings_singleton_ok from public.store_settings;

            \echo '--- seeded categories (expect 12: 7 top-level + 5 saree subcategories) ---'
            select count(*) as categories_seeded from public.categories;

            \echo '--- ID generators (expect SVS-P-000001 / SVS-ORD-20261002-00001 pattern) ---'
            select public.next_product_code() as next_product_code;

            \echo '--- policies present (expect > 40) ---'
            select count(*) as policy_count from pg_policies where schemaname = 'public';
          SQL
