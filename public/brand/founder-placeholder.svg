<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Founder portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b1a2e"/>
      <stop offset="0.55" stop-color="#43111f"/>
      <stop offset="1" stop-color="#2d0a14"/>
    </linearGradient>
    <linearGradient id="zari" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eed9a0"/>
      <stop offset="0.5" stop-color="#d4a94e"/>
      <stop offset="1" stop-color="#b98f3e"/>
    </linearGradient>
  </defs>
  <rect width="480" height="480" fill="url(#bg)"/>
  <rect x="14" y="14" width="452" height="452" fill="none" stroke="url(#zari)" stroke-width="2" opacity="0.7"/>
  <rect x="24" y="24" width="432" height="432" fill="none" stroke="#e8c877" stroke-width="0.8" opacity="0.4"/>
  <!-- drape lines echoing the saree art -->
  <path d="M0 340 C 140 300, 260 420, 480 350 L 480 480 L 0 480 Z" fill="#3a0f1c" opacity="0.55"/>
  <path d="M0 400 C 170 370, 300 460, 480 400 L 480 480 L 0 480 Z" fill="url(#zari)" opacity="0.25"/>
  <!-- monogram -->
  <text x="240" y="235" text-anchor="middle" font-family="Georgia, 'Playfair Display', 'Times New Roman', serif" font-size="120" fill="url(#zari)">SV</text>
  <line x1="150" y1="268" x2="330" y2="268" stroke="#e8c877" stroke-width="1.4" opacity="0.7"/>
  <line x1="165" y1="278" x2="315" y2="278" stroke="#e8c877" stroke-width="0.9" opacity="0.45"/>
  <text x="240" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="5" fill="#e8c877" opacity="0.8">FOUNDER</text>
  <circle cx="70" cy="90" r="4" fill="#e8c877" opacity="0.55"/>
  <circle cx="410" cy="90" r="4" fill="#e8c877" opacity="0.55"/>
  <circle cx="70" cy="410" r="4" fill="#e8c877" opacity="0.55"/>
  <circle cx="410" cy="410" r="4" fill="#e8c877" opacity="0.55"/>
</svg>
