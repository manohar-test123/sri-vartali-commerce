<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Sri Vartali logo">
  <defs>
    <linearGradient id="medallion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b1a2e"/>
      <stop offset="1" stop-color="#3a0f1c"/>
    </linearGradient>
    <linearGradient id="zari" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eed9a0"/>
      <stop offset="0.5" stop-color="#d4a94e"/>
      <stop offset="1" stop-color="#b98f3e"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="24" fill="url(#medallion)"/>
  <rect x="2" y="2" width="92" height="92" rx="24" fill="none" stroke="url(#zari)" stroke-width="2.5"/>
  <rect x="8" y="8" width="80" height="80" rx="19" fill="none" stroke="#e8c877" stroke-width="0.8" opacity="0.5"/>
  <!-- zari corner dots -->
  <circle cx="16" cy="16" r="1.8" fill="#e8c877" opacity="0.85"/>
  <circle cx="80" cy="16" r="1.8" fill="#e8c877" opacity="0.85"/>
  <circle cx="16" cy="80" r="1.8" fill="#e8c877" opacity="0.85"/>
  <circle cx="80" cy="80" r="1.8" fill="#e8c877" opacity="0.85"/>
  <!-- SV monogram -->
  <text x="48" y="56" text-anchor="middle" font-family="Georgia, 'Playfair Display', 'Times New Roman', serif" font-size="36" letter-spacing="1" fill="url(#zari)">SV</text>
  <!-- loom line under the monogram -->
  <line x1="26" y1="66" x2="70" y2="66" stroke="#e8c877" stroke-width="1.2" opacity="0.7"/>
  <line x1="31" y1="70" x2="65" y2="70" stroke="#e8c877" stroke-width="0.8" opacity="0.45"/>
</svg>
